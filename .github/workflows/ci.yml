name: Research unit tests
on:
  push:
    branches: [main, feature/order-sensitive-visual-memory]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: pytest -q
      - name: One-step end-to-end smoke
        run: python train.py --steps 1 --train-count 24 --val-count 16 --test-count 16 --batch-size 8 --device cpu --out /tmp/smoke.json
