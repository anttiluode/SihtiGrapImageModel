name: Inspect learned phase checkpoints
on:
  push:
    branches: [analysis/inspect-phase-checkpoints]
    paths:
      - 'inspect_checkpoint.py'
      - '.github/workflows/inspect-phase-checkpoints.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and NumPy
        run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Load saved models and inspect their exact byte-valued memories
        run: python inspect_checkpoint.py --limit 256 --out checkpoint_inspection --print-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-inspection
          path: checkpoint_inspection/
          retention-days: 30
